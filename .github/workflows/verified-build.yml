name: Verified build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: pnpm
      - run: python -m pip install --requirement requirements-build.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm data:fetch
      - run: pnpm build:verified
      - run: git diff --exit-code -- graph-data.js data/processed/eligible-lexicon.csv data/reports
