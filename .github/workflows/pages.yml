name: Deploy static site to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: pnpm

      - name: Check runtime shell
        run: pnpm smoke:browser

      - name: Package static site
        run: pnpm release:package

      - name: Check packaged site
        run: WORDCLOUD_STATIC_ROOT=dist pnpm smoke:browser

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
