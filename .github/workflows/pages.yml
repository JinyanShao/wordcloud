name: Runtime CI and Pages deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate static runtime
        run: |
          python3 scripts/build_summary.py --check-docs
          git diff --exit-code -- data/build-summary.json
          python3 scripts/validate_runtime.py

  deploy:
    needs: runtime-ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir dist
          mkdir -p dist/data
          cp index.html app.js styles.css graph-data.js data.js dict.js dist/
          cp data/build-summary.json dist/data/
          touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
